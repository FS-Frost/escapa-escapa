<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Escapa">
  <!-- Manifest and icons are generated from code at build time (pwa plugin in vite.config.ts) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>Escapa Escapa</title>
</head>

<!-- Visible text comes from src/i18n.ts via data-i18n / data-i18n-placeholder / data-i18n-aria.
     .cols/.col groups stack vertically, and sit side by side on short landscape screens.
     .hint-keys lines are hidden on touch-only devices. -->
<body>
  <div id="game-wrapper">
    <canvas id="game"></canvas>

    <!-- MENU -->
    <div id="overlay-menu" class="overlay">
      <div class="panel">
        <div class="cols">
          <div class="col">
            <h1 class="title">Escapa <br>Escapa</h1>
            <p class="subtitle" data-i18n="menu.subtitle"></p>
            <div class="menu-name-row">
              <label for="menu-name-input" class="menu-name-label" data-i18n="menu.nameLabel"></label>
              <input id="menu-name-input" type="text" maxlength="12" autocomplete="off" data-i18n-placeholder="defaultName">
            </div>
            <div class="menu-name-row">
              <span class="menu-name-label" data-i18n="stats.difficulty"></span>
              <div id="diff-select" class="seg" role="group">
                <button data-diff="easy" data-i18n="diff.easy"></button>
                <button data-diff="normal" data-i18n="diff.normal"></button>
                <button data-diff="hard" data-i18n="diff.hard"></button>
              </div>
            </div>
          </div>
          <div class="col">
            <button id="btn-start" class="btn btn-primary" data-i18n="menu.play"></button>
            <div class="menu-grid">
              <button id="btn-hiscores-menu" class="btn btn-small" data-i18n="menu.records"></button>
              <button id="btn-options-menu" class="btn btn-small" data-i18n="menu.options"></button>
              <button id="btn-jukebox-menu" class="btn btn-small" data-i18n="menu.jukebox"></button>
              <button id="btn-skins-menu" class="btn btn-small" data-i18n="menu.skins"></button>
            </div>
            <button id="btn-install" class="btn hidden" data-i18n="menu.install"></button>
            <div class="controls-hint">
              <span data-i18n="controls.tap"></span>
              <span class="hint-portrait" data-i18n="controls.pad"></span>
              <span class="hint-keys" data-i18n="controls.keys"></span>
              <span class="hint-keys" data-i18n="controls.pause"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PAUSE -->
    <div id="overlay-pause" class="overlay hidden">
      <div class="panel">
        <h2 data-i18n="pause.title"></h2>
        <div id="pause-main" class="cols">
          <div class="col">
            <button id="btn-resume" class="btn btn-primary" data-i18n="pause.resume"></button>
            <button id="btn-options-pause" class="btn" data-i18n="menu.options"></button>
          </div>
          <div class="col">
            <button id="btn-restart-pause" class="btn" data-i18n="pause.restart"></button>
            <button id="btn-menu-pause" class="btn" data-i18n="pause.menu"></button>
          </div>
        </div>
        <details id="pause-controls" class="controls-details">
          <summary data-i18n="controls.title"></summary>
          <div class="controls-hint">
            <span data-i18n="controls.tap"></span>
            <span class="hint-portrait" data-i18n="controls.pad"></span>
            <span class="hint-keys" data-i18n="controls.keys"></span>
            <span class="hint-keys" data-i18n="controls.pause"></span>
          </div>
        </details>
        <div id="pause-confirm" class="btn-stack hidden">
          <p id="pause-confirm-text" class="confirm-text"></p>
          <div class="btn-row">
            <button id="btn-confirm-yes" class="btn btn-danger" data-i18n="common.yes"></button>
            <button id="btn-confirm-no" class="btn btn-primary" data-i18n="common.no"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- OPTIONS (opened from menu or pause; sits above them) -->
    <div id="overlay-options" class="overlay overlay-top hidden">
      <div class="panel">
        <h2 data-i18n="opts.title"></h2>
        <div class="cols">
          <div class="col options-section">
            <label class="option-row">
              <span data-i18n="opts.language"></span>
              <select id="sel-lang"></select>
            </label>
            <label class="option-row">
              <span data-i18n="opts.music"></span>
              <input id="music-slider" type="range" min="0" max="100" value="60">
            </label>
            <label class="option-row">
              <span data-i18n="opts.sfx"></span>
              <input id="sfx-slider" type="range" min="0" max="100" value="70">
            </label>
            <label class="option-row">
              <input id="chk-mute" type="checkbox">
              <span data-i18n="opts.mute"></span>
            </label>
          </div>
          <div class="col options-section">
            <label id="row-vibration" class="option-row">
              <input id="chk-vibration" type="checkbox">
              <span data-i18n="opts.vibration"></span>
            </label>
            <label class="option-row">
              <input id="chk-radar" type="checkbox">
              <span data-i18n="opts.radar"></span>
            </label>
            <label class="option-row">
              <input id="chk-reduce-motion" type="checkbox">
              <span data-i18n="opts.reduceMotion"></span>
            </label>
            <button id="btn-fullscreen" class="btn btn-small"></button>
            <button id="btn-tutorial" class="btn btn-small" data-i18n="opts.tutorial"></button>
          </div>
        </div>
        <button id="btn-close-options" class="btn btn-primary" data-i18n="opts.back"></button>
      </div>
    </div>

    <!-- FONOTECA (jukebox, from the main menu) -->
    <div id="overlay-jukebox" class="overlay overlay-top hidden">
      <div class="panel">
        <h2 data-i18n="juke.title"></h2>
        <div class="cols">
          <div class="col">
            <div id="juke-list" class="juke-list"></div>
          </div>
          <div class="col">
            <div id="juke-viz" class="juke-viz" aria-hidden="true"></div>
            <button id="btn-juke-play" class="btn btn-primary"></button>
            <div class="options-section juke-options">
              <label class="option-row">
                <input id="chk-juke-rush" type="checkbox">
                <span data-i18n="juke.rush"></span>
              </label>
              <label class="option-row">
                <input id="chk-juke-viz" type="checkbox" checked>
                <span data-i18n="juke.viz"></span>
              </label>
              <label class="option-row">
                <input id="chk-juke-continuous" type="checkbox">
                <span data-i18n="juke.continuous"></span>
              </label>
            </div>
            <button id="btn-juke-close" class="btn" data-i18n="records.close"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODE SELECT (JUGAR) -->
    <div id="overlay-modes" class="overlay overlay-top hidden">
      <div class="panel">
        <h2 data-i18n="modes.title"></h2>
        <button id="btn-mode-stages" class="btn btn-primary mode-btn"><span data-i18n="modes.stages"></span><small id="modes-stages-sub"></small></button>
        <button id="btn-mode-endless" class="btn mode-btn"><span data-i18n="modes.endless"></span><small id="modes-endless-sub"></small></button>
        <button id="btn-mode-daily" class="btn mode-btn"><span data-i18n="modes.daily"></span><small id="modes-daily-sub"></small></button>
        <button id="btn-modes-back" class="btn btn-small" data-i18n="opts.back"></button>
      </div>
    </div>

    <!-- STAGE SELECT -->
    <div id="overlay-stages" class="overlay overlay-top hidden">
      <div class="panel panel-wide">
        <h2 data-i18n="stages.title"></h2>
        <div id="stage-grid" class="stage-grid"></div>
        <button id="btn-stages-back" class="btn btn-small" data-i18n="opts.back"></button>
      </div>
    </div>

    <!-- SKINS -->
    <div id="overlay-skins" class="overlay overlay-top hidden">
      <div class="panel panel-wide">
        <h2 data-i18n="skins.title"></h2>
        <p id="skins-wallet" class="subtitle"></p>
        <div id="skin-grid" class="skin-grid"></div>
        <button id="btn-skins-back" class="btn btn-small" data-i18n="opts.back"></button>
      </div>
    </div>

    <!-- TUTORIAL OFFER (first time JUGAR is pressed) -->
    <div id="overlay-tutorial-offer" class="overlay overlay-top hidden">
      <div class="panel">
        <h2 data-i18n="tut.offer.title"></h2>
        <p class="subtitle" data-i18n="tut.offer.body"></p>
        <button id="btn-tutorial-yes" class="btn btn-primary" data-i18n="tut.offer.yes"></button>
        <button id="btn-tutorial-no" class="btn" data-i18n="tut.offer.no"></button>
      </div>
    </div>

    <!-- INSTALL HELP (iOS has no install prompt: explain Add to Home Screen) -->
    <div id="overlay-install-ios" class="overlay overlay-top hidden">
      <div class="panel">
        <h2 data-i18n="install.iosTitle"></h2>
        <ol class="install-steps">
          <li data-i18n="install.iosStep1"></li>
          <li data-i18n="install.iosStep2"></li>
          <li data-i18n="install.iosStep3"></li>
        </ol>
        <button id="btn-install-ios-close" class="btn btn-primary" data-i18n="records.close"></button>
      </div>
    </div>

    <!-- DEAD -->
    <div id="overlay-dead" class="overlay hidden">
      <div class="panel">
        <h2 id="dead-title" class="dead-title"></h2>
        <p id="dead-note" class="victory-note hidden"></p>
        <div class="cols">
          <div class="col"><div id="dead-stats" class="stats-block"></div></div>
          <div class="col">
            <button id="btn-restart-dead" class="btn btn-primary" data-i18n="dead.retry"></button>
            <button id="btn-menu-dead" class="btn" data-i18n="pause.menu"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- VICTORY -->
    <div id="overlay-victory" class="overlay hidden">
      <div class="panel panel-victory">
        <h2 id="victory-title" class="victory-title"></h2>
        <div id="victory-stars" class="stars-row"></div>
        <div class="cols">
          <div class="col">
            <div id="victory-stats" class="stats-block"></div>
          </div>
          <div class="col">
            <ul id="victory-star-list" class="star-list"></ul>
            <button id="btn-next-stage" class="btn btn-primary" data-i18n="victory.next"></button>
            <button id="btn-restart-victory" class="btn" data-i18n="victory.replay"></button>
            <button id="btn-menu-victory" class="btn" data-i18n="pause.menu"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- HIGH SCORES -->
    <div id="overlay-hiscore" class="overlay hidden">
      <div class="panel">
        <h2 data-i18n="records.title"></h2>
        <div id="records-tabs" class="seg" role="group">
          <button data-diff="easy" data-i18n="diff.easy"></button>
          <button data-diff="normal" data-i18n="diff.normal"></button>
          <button data-diff="hard" data-i18n="diff.hard"></button>
        </div>
        <div id="scores-list" class="scores-list"></div>
        <button id="btn-close-hiscores" class="btn" data-i18n="records.close"></button>
      </div>
    </div>

    <!-- NO WEBGL2 -->
    <div id="no-webgl" class="overlay hidden">
      <div class="panel">
        <h2 data-i18n="noWebgl.title"></h2>
        <p class="subtitle" data-i18n="noWebgl.body"></p>
      </div>
    </div>

    <!-- Pause / tutorial-skip buttons over the canvas -->
    <button id="pause-btn" data-i18n-aria="pause.aria">⏸</button>
    <button id="tutorial-skip" data-i18n="tut.skip"></button>
  </div>

  <!-- Lane pad, portrait only (via body.portrait): up / down one lane per press -->
  <div id="touch-pad">
    <button class="pad-btn" data-dir="1" data-i18n="pad.up"></button>
    <button class="pad-btn" data-dir="-1" data-i18n="pad.down"></button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
